<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%" style="overflow: visible;">
  <defs>
    <!-- Gradient: Light Blue to Teal for the harmonized grid -->
    <linearGradient id="readyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#63B3ED" />
      <stop offset="100%" stop-color="#4FD1C5" />
    </linearGradient>
  </defs>

  <!-- Solid White Background -->
  <rect x="0" y="0" width="240" height="240" fill="#FFFFFF" rx="24"/>

  <!-- Stages 1 & 2: Raw & Transitioning (Solid Slate Gray) -->
  <g fill="#64748B">
    <!-- Stage 1: Scattered -->
    <circle cx="10" cy="175" r="5"/>
    <circle cx="14" cy="90" r="7"/>
    <circle cx="25" cy="140" r="10"/>
    <circle cx="35" cy="55" r="6"/>
    <circle cx="42" cy="105" r="12"/>
    <circle cx="50" cy="185" r="9"/>
    <circle cx="57" cy="130" r="5"/>
    <circle cx="67" cy="60" r="11"/>
    <circle cx="75" cy="160" r="7"/>

    <!-- Stage 2: Funneling -->
    <circle cx="90" cy="77" r="7"/>
    <circle cx="95" cy="167" r="8"/>
    <circle cx="103" cy="115" r="10"/>
    <circle cx="113" cy="143" r="6"/>
    <circle cx="125" cy="85" r="8"/>  <!-- Aligned to top row of grid -->
    <circle cx="137" cy="120" r="8"/> <!-- Aligned to middle row of grid -->
    <circle cx="129" cy="155" r="8"/> <!-- Aligned to bottom row of grid -->
  </g>

  <!-- Stage 3: Harmonized & AI-Ready Grid -->
  <g fill="url(#readyGrad)">
    <!-- Top Row -->
    <circle cx="155" cy="85" r="9"/>
    <circle cx="190" cy="85" r="9"/>
    <circle cx="225" cy="85" r="9"/>
    
    <!-- Middle Row -->
    <circle cx="155" cy="120" r="9"/>
    <circle cx="190" cy="120" r="9"/>
    <circle cx="225" cy="120" r="9"/>
    
    <!-- Bottom Row -->
    <circle cx="155" cy="155" r="9"/>
    <circle cx="190" cy="155" r="9"/>
    <circle cx="225" cy="155" r="9"/>
  </g>
</svg>
